<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">The Atlas workflow</title>
  <desc id="desc">A connected three-step workflow: learn the system, diagnose the signal, and resolve or escalate with a clear record.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111A57"/>
      <stop offset="1" stop-color="#080D31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#93A9FF"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#6E86E8"/>
    </marker>
  </defs>
  <rect width="1200" height="330" rx="22" fill="#03051A"/>
  <g fill="none" stroke="#243785" stroke-width="1">
    <path d="M32 70 H1168"/><path d="M32 260 H1168"/>
    <path d="M90 20 V310" stroke-dasharray="3 9"/><path d="M1110 20 V310" stroke-dasharray="3 9"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="56" y="48" font-size="13" font-weight="700" fill="#93A9FF" letter-spacing="3">A PRACTICAL PATH THROUGH IT</text>
    <g transform="translate(55 95)">
      <rect width="310" height="142" rx="16" fill="url(#panel)" stroke="#2A3A9E"/>
      <circle cx="42" cy="41" r="22" fill="#14235F" stroke="#5B8CFF"/>
      <path d="M32 38 L42 28 L52 38 M42 28 V52 M32 44 H52" stroke="#AFC1FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="78" y="37" font-size="21" font-weight="700" fill="#F1F3FF">01 / Learn</text>
      <text x="25" y="78" font-size="15" fill="#D8DFFF">Understand the system, terminology,</text>
      <text x="25" y="101" font-size="15" fill="#D8DFFF">tools and expected behaviour.</text>
      <text x="25" y="124" font-size="12" fill="#93A9FF">CONCEPTS · TOOLS · LEARNING PATHS</text>
    </g>
    <path d="M375 166 H426" stroke="#6E86E8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g transform="translate(445 95)">
      <rect width="310" height="142" rx="16" fill="url(#panel)" stroke="#2A3A9E"/>
      <circle cx="42" cy="41" r="22" fill="#14235F" stroke="#5B8CFF"/>
      <circle cx="39" cy="38" r="9" stroke="#AFC1FF" stroke-width="2.5" fill="none"/><path d="M46 45 L54 53" stroke="#AFC1FF" stroke-width="3" stroke-linecap="round"/>
      <text x="78" y="37" font-size="21" font-weight="700" fill="#F1F3FF">02 / Diagnose</text>
      <text x="25" y="78" font-size="15" fill="#D8DFFF">Start with safe checks, follow evidence</text>
      <text x="25" y="101" font-size="15" fill="#D8DFFF">and isolate the likely cause.</text>
      <text x="25" y="124" font-size="12" fill="#93A9FF">SYMPTOMS · FIRST CHECKS · LOGS</text>
    </g>
    <path d="M765 166 H816" stroke="#6E86E8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g transform="translate(835 95)">
      <rect width="310" height="142" rx="16" fill="url(#panel)" stroke="#2A3A9E"/>
      <circle cx="42" cy="41" r="22" fill="#122F4A" stroke="#3BE0A0"/>
      <path d="M30 41 L38 49 L54 31" stroke="#78F0BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="78" y="37" font-size="21" font-weight="700" fill="#F1F3FF">03 / Resolve</text>
      <text x="25" y="78" font-size="15" fill="#D8DFFF">Apply the right fix, escalate safely</text>
      <text x="25" y="101" font-size="15" fill="#D8DFFF">and leave a useful ticket record.</text>
      <text x="25" y="124" font-size="12" fill="#78F0BF">PLAYBOOKS · ESCALATION · HANDOVER</text>
    </g>
    <text x="600" y="292" text-anchor="middle" font-size="14" fill="#A1AADB">One connected knowledge base — from understanding to action.</text>
  </g>
</svg>