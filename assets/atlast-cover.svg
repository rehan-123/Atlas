<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Atlast — map the work, find the next step</title>
  <desc id="desc">A glowing network atlas connects learning, troubleshooting, and incident response.</desc>
  <defs>
    <linearGradient id="bg" x1="60" y1="24" x2="1142" y2="427" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081725"/>
      <stop offset=".54" stop-color="#0B1C2B"/>
      <stop offset="1" stop-color="#111B31"/>
    </linearGradient>
    <linearGradient id="line" x1="708" y1="99" x2="1080" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#50E0BE"/>
      <stop offset=".54" stop-color="#6CA7FF"/>
      <stop offset="1" stop-color="#F0B96A"/>
    </linearGradient>
    <linearGradient id="titleGlow" x1="118" y1="150" x2="586" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4FBFF"/>
      <stop offset="1" stop-color="#B7D5E9"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="matrix(194 0 0 166 931 218)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#36BDA8" stop-opacity=".19"/>
      <stop offset="1" stop-color="#36BDA8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#9CC2D9" fill-opacity=".12"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="440" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="28" fill="url(#dots)"/>
  <path d="M23 94C174 14 310 58 438 21s243-8 324 33m-741 322c137-82 276-28 389-61s232-36 309-2m321-273c-56 73-35 117-3 166s44 108-14 194m113-336c-61 52-70 98-43 146s42 108 2 158" fill="none" stroke="#4C7489" stroke-opacity=".18" stroke-width="1.5"/>
  <ellipse cx="931" cy="218" rx="194" ry="166" fill="url(#halo)"/>

  <g transform="translate(78 72)">
