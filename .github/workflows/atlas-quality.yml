name: Atlas quality checks

on:
  push:
    branches:
      - main
      - "chore/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check branding, README links, and SVG markup
        run: python scripts/atlas_quality_check.py
      - name: Lint the Obsidian vault
        working-directory: vault/IT-Atlas
        run: python3 _system/vault_lint.py
