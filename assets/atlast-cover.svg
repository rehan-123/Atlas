  <text x="108" y="260" fill="#63D6C0" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="650" letter-spacing="2.6">MAP THE WORK. FIND THE NEXT STEP.</text>
  <text x="108" y="305" fill="#A6BAC8" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="18">Learn the systems. Fix the issue. Keep the service running.</text>

