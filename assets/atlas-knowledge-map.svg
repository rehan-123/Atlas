<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Atlast: from first principles to the fix</title>
  <desc id="desc">Three connected stages: learn the system, follow a troubleshooting path, and respond with a practical playbook. Concepts, tools, and quick references connect the stages.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081521"/><stop offset="1" stop-color="#10283b"/></linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#52e3c2"/><stop offset=".52" stop-color="#65a9ff"/><stop offset="1" stop-color="#f1bf70"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#52e3c2" stop-opacity=".18"/><stop offset="1" stop-color="#52e3c2" stop-opacity="0"/></radialGradient>
    <pattern id="mapgrid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d9f5ff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1000" height="360" rx="22" fill="url(#background)"/>
  <rect width="1000" height="360" rx="22" fill="url(#mapgrid)"/>
  <ellipse cx="500" cy="187" rx="390" ry="175" fill="url(#halo)"/>
  <text x="40" y="43" fill="#52e3c2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="2">A PRACTICAL IT KNOWLEDGE MAP</text>
  <text x="40" y="80" fill="#f2f7fc" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="29" font-weight="700">From first principles to the fix</text>

  <path d="M220 173H780" fill="none" stroke="url(#trail)" stroke-width="3" stroke-linecap="round" opacity=".85"/>
  <path d="M358 166l12 7-12 7m258-14 12 7-12 7" fill="none" stroke="#d8eeff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <g transform="translate(40 112)">
      <rect width="280" height="124" rx="16" fill="#102b35" stroke="#52e3c2" stroke-opacity=".72"/>
      <circle cx="34" cy="34" r="17" fill="#52e3c2" fill-opacity=".16"/><text x="34" y="40" text-anchor="middle" fill="#66e9cb" font-size="17" font-weight="700">01</text>
      <text x="62" y="40" fill="#eff8ff" font-size="20" font-weight="700">Learn the system</text>
      <text x="22" y="76" fill="#c0d1df" font-size="15">Build from computer basics to</text><text x="22" y="98" fill="#c0d1df" font-size="15">networks, cloud, and operations.</text>
    </g>
    <g transform="translate(360 112)">
      <rect width="280" height="124" rx="16" fill="#142538" stroke="#69aaff" stroke-opacity=".78"/>
      <circle cx="34" cy="34" r="17" fill="#69aaff" fill-opacity=".16"/><text x="34" y="40" text-anchor="middle" fill="#8bbdff" font-size="17" font-weight="700">02</text>
      <text x="62" y="40" fill="#eff8ff" font-size="20" font-weight="700">Find the cause</text>
      <text x="22" y="76" fill="#c0d1df" font-size="15">Follow checks for Windows,</text><text x="22" y="98" fill="#c0d1df" font-size="15">network, identity, and devices.</text>
    </g>
    <g transform="translate(680 112)">
      <rect width="280" height="124" rx="16" fill="#2b2921" stroke="#f1bf70" stroke-opacity=".8"/>
      <circle cx="34" cy="34" r="17" fill="#f1bf70" fill-opacity=".16"/><text x="34" y="40" text-anchor="middle" fill="#f1c979" font-size="17" font-weight="700">03</text>
      <text x="62" y="40" fill="#eff8ff" font-size="20" font-weight="700">Make the next move</text>
      <text x="22" y="76" fill="#d6ccba" font-size="15">Use clear playbooks to respond,</text><text x="22" y="98" fill="#d6ccba" font-size="15">recover, and verify.</text>
    </g>
  </g>

  <text x="40" y="286" fill="#8ea7ba" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.5">CONNECTED ALONG THE WAY</text>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600">
    <rect x="40" y="302" width="170" height="34" rx="17" fill="#15313c" stroke="#52e3c2" stroke-opacity=".55"/><text x="125" y="324" text-anchor="middle" fill="#9beedb">◉  Concepts</text>
    <rect x="228" y="302" width="170" height="34" rx="17" fill="#192c42" stroke="#69aaff" stroke-opacity=".55"/><text x="313" y="324" text-anchor="middle" fill="#a9ceff">⌘  Tools</text>
    <rect x="416" y="302" width="214" height="34" rx="17" fill="#322c20" stroke="#f1bf70" stroke-opacity=".55"/><text x="523" y="324" text-anchor="middle" fill="#f3d79e">⌕  Quick references</text>
  </g>
  <text x="960" y="324" text-anchor="end" fill="#708a9f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1">ATLAST  /  IT, CONNECTED</text>
  <rect x=".75" y=".75" width="998.5" height="358.5" rx="21.25" fill="none" stroke="#34536a" stroke-opacity=".8" stroke-width="1.5"/>
</svg>
