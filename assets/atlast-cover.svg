    <circle cx="948" cy="101" r="6" fill="#76C8E0"/><circle cx="1027" cy="150" r="7" fill="#76AEFF"/>
    <circle cx="1084" cy="117" r="4" fill="#F0BD74"/><circle cx="853" cy="243" r="6" fill="#60CFBF"/>
    <circle cx="941" cy="273" r="8" fill="#63B9FF"/><circle cx="1013" cy="199" r="5" fill="#8DBBFA"/>
